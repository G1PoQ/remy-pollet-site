<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
/* Layout: a white-cube gallery wall. Works hang at their true relative scale; type stays quiet around them. */
:root{
  color-scheme: light;
  --wall:#F6F5F2;
  --panel:#ECEAE5;
  --ink:#171614;
  --ink-2:#4A4742;
  --muted:#67635D;
  --line:#DCD9D3;
  --night:#1B1A18;
  --on-night:#ECEAE5;
  --on-night-2:#B3AEA6;
  --night-line:#36332F;
  --figure:#CFCBC4;
  --paper:#F2F0EB;
  --hh:77px;
  --error:#8A2C1F;
  --display:'Palatino Linotype', Palatino, 'Book Antiqua', 'URW Palladio L', 'TeX Gyre Pagella', P052, 'Gentium Book Plus', Georgia, serif;
  --body:'Hanken Grotesk', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --cartel:'Courier Prime', 'Courier New', Courier, monospace;
  --hang:0 1px 1px rgba(23,22,20,.10), 0 22px 34px -20px rgba(23,22,20,.42);
  --hang-up:0 1px 1px rgba(23,22,20,.10), 0 30px 44px -22px rgba(23,22,20,.50);
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--wall);color:var(--ink);font:300 16px/1.65 var(--body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--wall)}
a{color:inherit}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
main:focus{outline:none}
em{font-style:italic}
.wrap{width:min(1280px,100% - 2*clamp(0px,4vw,48px));margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.skip{position:absolute;left:-9999px;top:0}
.skip:focus{left:16px;top:16px;z-index:60;background:var(--ink);color:var(--wall);padding:10px 16px}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--wall);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:76px}
.brand{font-family:var(--display);font-weight:400;font-size:19px;letter-spacing:.3em;text-transform:uppercase;text-decoration:none;white-space:nowrap}
.nav{display:flex;align-items:center;gap:42px}
.nav a{font-size:14.5px;font-weight:500;letter-spacing:.13em;text-transform:uppercase;text-decoration:none;padding:12px 0;border-bottom:1px solid transparent}
.nav a:hover{border-bottom-color:var(--line)}
.nav a[aria-current="page"]{border-bottom-color:var(--ink)}
.nav .nav-cta{border:1px solid var(--ink);padding:12px 22px}
.nav .nav-cta:hover,.nav .nav-cta[aria-current="page"]{background:var(--ink);color:var(--wall)}
.menu-btn{display:none;align-items:center;justify-content:center;gap:10px;min-height:44px;padding:0 4px;border:0;background:transparent;cursor:pointer;font-size:14.5px;font-weight:500;letter-spacing:.13em;text-transform:uppercase}
@media (max-width:860px){.nav{display:none}.menu-btn{display:inline-flex}}
.sheet{position:fixed;inset:0;z-index:40;background:var(--wall);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;min-height:76px;border-bottom:1px solid var(--line)}
.sheet nav{display:flex;flex-direction:column;padding-block:32px}
.sheet nav a{font-family:var(--display);font-size:32px;line-height:1.1;text-decoration:none;padding-block:12px;border-bottom:1px solid var(--line)}

/* Type */
.eyebrow{font-size:12px;font-weight:400;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.display{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:0}
h1.display{font-size:clamp(42px,5.6vw,80px);line-height:1.04}
h2.display{font-size:clamp(30px,3.6vw,46px);line-height:1.12}
.lede{margin:0;max-width:34em;color:var(--ink-2);font-size:17px}
.cartel{font-family:var(--cartel);font-style:italic;font-size:13px;color:var(--muted);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 28px;background:var(--ink);color:var(--wall);text-decoration:none;font-size:12.5px;font-weight:400;letter-spacing:.16em;text-transform:uppercase;border:1px solid var(--ink);cursor:pointer;transition:background .25s,color .25s}
.btn:hover{background:var(--wall);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--wall)}
.link-caps{display:inline-flex;align-items:center;min-height:44px;font-size:12.5px;font-weight:400;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;background:none;border:0;padding:0;cursor:pointer}
.link-caps span{border-bottom:1px solid currentColor;padding-bottom:3px}
.stack{display:flex;flex-direction:column;gap:20px}

/* Sections */
.sec{padding-block:clamp(72px,10vw,128px)}
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:12px 24px;margin-bottom:clamp(32px,4vw,48px)}

/* Hero */
.hero{padding-block:clamp(48px,7vw,96px) clamp(56px,7vw,96px)}
.hero-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:32px 64px}
.hero-head > .stack:first-child{flex:1 1 460px;min-width:0}
.hero-side{flex:0 1 400px;min-width:0;display:flex;flex-direction:column;gap:24px}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:16px 28px}

/* En-tête de l'accueil : un détail de toile à la largeur des sections. Le nom est dans un encadré
   du blanc de la page, collé au bord gauche et centré en hauteur ; les onglets passent sous la toile. */
.top{transition:background .35s,border-color .35s,color .35s}
.brand{transition:opacity .35s}
.top.over{background:transparent;border-bottom-color:transparent}
.top.over .brand{opacity:0;pointer-events:none}
@media (min-width:861px){.top.over .nav{visibility:hidden}}
.mast-frame{margin-top:calc(-1 * var(--hh));padding-top:clamp(12px,2vw,28px)}
.mast{--fade:1.4s;--mpad:clamp(20px,3.4vw,48px);display:flex;flex-direction:column;height:clamp(300px,23.6vw,340px);color:var(--ink)}
.mast-art{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--panel)}
.mast-slides{position:absolute;inset:0}
.mast-slide{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover;opacity:0;transition:opacity var(--fade) ease}
.mast-slide.is-on{opacity:1}
.mast-top{position:absolute;z-index:2;left:0;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:24px 40px 20px var(--mpad);background:var(--wall)}
.mast-name{font-family:var(--display);font-weight:400;text-transform:uppercase;line-height:1;margin:0 -.4em 0 0;font-size:clamp(28px,2.36vw,34px);letter-spacing:.4em}
/* Le sous-titre occupe toute la largeur du nom : son dernier mot finit sous la dernière lettre du nom */
.mast-sub{align-self:stretch;display:flex;justify-content:space-between;gap:0 1em;font-size:clamp(9.5px,.8vw,11.5px);font-weight:400;letter-spacing:.32em;text-transform:uppercase;color:var(--muted)}
.mast-sub>span{margin-right:-.32em;white-space:nowrap}
.mast-bot{display:flex;align-items:center;justify-content:space-between;gap:16px 40px;padding:8px var(--mpad)}
.mast-nav{display:flex;flex-wrap:wrap;gap:8px 44px}
.mast-nav a{font-size:13.5px;font-weight:400;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;padding:10px 0;border-bottom:1px solid transparent}
.mast-nav a:hover{border-bottom-color:currentColor}
.mast-meta{display:flex;align-items:center;gap:14px 26px;margin-left:auto}
.mast-dots{display:flex;align-items:center;gap:8px}
.mast-dots button{position:relative;width:34px;height:20px;padding:0;border:0;background:none;cursor:pointer;color:inherit}
.mast-dots button::before,.mast-dots button::after{content:"";position:absolute;left:0;top:9px;height:2px}
.mast-dots button::before{right:0;background:currentColor;opacity:.3}
.mast-dots button::after{width:0;background:currentColor}
.mast-dots button[aria-current="true"]::after{animation:mastFill var(--d,6s) linear forwards}
.mast.is-paused .mast-dots button[aria-current="true"]::after,.mast.is-still .mast-dots button[aria-current="true"]::after{animation:none;width:100%}
@keyframes mastFill{from{width:0}to{width:100%}}
.mast-count{color:inherit;opacity:.85;white-space:nowrap}
.mast-pause{flex:none;width:32px;height:32px;padding:0;display:grid;place-items:center;border:1px solid currentColor;border-radius:50%;background:none;color:inherit;cursor:pointer;opacity:.7}
.mast-pause:hover{opacity:1}
.mast-credit{color:var(--muted);text-decoration:none;min-height:32px;display:inline-flex;align-items:center}
.mast-credit:hover{text-decoration:underline;text-underline-offset:4px}
.mast :focus-visible{outline-color:currentColor}
@media (max-width:1100px){.mast-name{font-size:24px;letter-spacing:.38em;margin-right:-.38em}.mast-sub{font-size:9px;letter-spacing:.16em}.mast-sub>span{margin-right:-.16em}}
@media (max-width:860px){.mast-frame{margin-top:0;padding-top:0}.mast-nav{display:none}}
@media (max-width:560px){.mast{height:260px}.mast-top{padding:18px 20px 14px var(--mpad)}.mast-meta{margin-left:0;width:100%;justify-content:space-between}.mast-credit{display:none}.mast.is-single .mast-bot{display:none}}
@media (prefers-reduced-motion:reduce){.mast-slide{transition:none}}
.pick{display:flex;align-items:center;gap:8px}
.pick span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.85;margin-right:4px}
.pick button{width:44px;height:44px;padding:0;border:1px solid currentColor;opacity:.55;background:none;cursor:pointer;overflow:hidden;transition:opacity .2s}
.pick button:hover{opacity:.9}
.pick button[aria-pressed="true"]{opacity:1;outline:1px solid currentColor;outline-offset:3px}
.pick img{width:100%;height:100%;max-width:none;object-fit:cover}

/* Presentation images: one per series and per year */
.covers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:48px 28px}
@media (max-width:900px){.covers{grid-template-columns:repeat(2,minmax(0,1fr));gap:36px 18px}}
@media (max-width:520px){.covers{grid-template-columns:minmax(0,1fr)}}
.cover{text-decoration:none;display:flex;flex-direction:column;gap:14px;min-width:0}
.cover-img{position:relative;aspect-ratio:4/3;max-width:100%;overflow:hidden;background:var(--panel)}
.cover-img img{width:100%;height:100%;max-width:none;object-fit:cover;transition:transform 1.2s cubic-bezier(.2,.6,.2,1)}
.cover:hover .cover-img img{transform:scale(1.045)}
.cover-meta{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 12px}
.cover-meta .muted{font-size:14px;color:var(--muted)}
.browse{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:4px 36px}
.cats{display:flex;flex-wrap:wrap;gap:4px clamp(28px,4vw,56px);border-bottom:1px solid var(--line);margin-bottom:32px}
.cats a{font-family:var(--display);font-size:clamp(25px,2.7vw,36px);line-height:1.1;color:var(--muted);text-decoration:none;padding:4px 0 16px;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .2s,border-color .2s}
.cats a:hover{color:var(--ink)}
.cats a[aria-current="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.cats small{font-family:var(--body);font-size:12px;letter-spacing:.06em;color:var(--muted);margin-left:8px;vertical-align:super}
@media (max-width:560px){.cats{gap:0 22px;margin-bottom:24px}.cats a{font-size:21px;padding-bottom:10px}.cats small{margin-left:4px}}
.count-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 22px}
.toggle-f{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;background:none;border:0;padding:0;min-height:44px;cursor:pointer;color:var(--ink-2)}
.toggle-f span{border-bottom:1px solid currentColor;padding-bottom:3px}
.banner{position:relative;min-height:clamp(260px,30vw,380px);display:flex;align-items:flex-end;overflow:hidden;background:var(--panel);margin-bottom:28px}
.banner > img{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover}
.plate{position:relative;margin:clamp(16px,3vw,32px);background:var(--wall);padding:22px 28px;display:flex;flex-direction:column;gap:6px;max-width:calc(100% - 32px)}
.plate h2{font-size:clamp(32px,4vw,52px);line-height:1.1}
.plate .row-meta{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:14px;color:var(--ink-2)}
.banner-close{position:absolute;top:clamp(12px,2vw,20px);right:clamp(12px,2vw,20px);min-height:44px;padding:0 16px;background:var(--wall);border:0;cursor:pointer;font-size:13px;letter-spacing:.08em}

/* Scaled hang */
.scaled{--cm:1.6px}
.hang{display:flex;align-items:center;justify-content:center;gap:clamp(16px,4vw,64px);padding-bottom:40px;margin-top:clamp(56px,7vw,96px)}
.hang figure{position:relative;margin:0;flex:none}
.hang img{width:calc(var(--cm) * var(--w));max-width:none;height:auto;box-shadow:var(--hang);transition:transform .5s cubic-bezier(.2,.6,.2,1),box-shadow .5s}
.hang a:hover img{transform:translateY(-4px);box-shadow:var(--hang-up)}
.hang figcaption{position:absolute;left:0;top:calc(100% + 12px);white-space:nowrap;display:flex;flex-direction:column;gap:2px}
.hang:not(.hang-wrap) figure:last-child figcaption{left:auto;right:0;align-items:flex-end}
.hang-foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px 32px;border-top:1px solid var(--line);padding-top:18px;margin-top:16px}
.ruler{display:flex;align-items:center;gap:12px}
.ruler i{display:block;width:calc(var(--cm) * 100);height:8px;border:1px solid var(--muted);border-top:0}
.hang-note{margin:0;font-size:14px;color:var(--muted)}
.hang-wrap{flex-wrap:wrap;align-items:center;justify-content:flex-start;gap:48px clamp(28px,4vw,64px);padding-bottom:24px;margin-top:8px}
.hang-wrap figcaption{position:static;white-space:normal;width:100%;margin-top:10px}
@media (max-width:1099px){.hang:not(.hang-wrap) figcaption{display:none}.hang:not(.hang-wrap){padding-bottom:0}}

/* Accueil : accrochage, publication, citation, séparés par un filet fin */
.home-sec{padding-block:clamp(64px,8vw,104px)}
.home-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px 64px;align-items:end;margin-bottom:clamp(36px,4.5vw,60px)}
.home-head .stack{gap:16px}
.eyebrow-lg{font-size:15px;letter-spacing:.24em}
.home-head h2.display{font-size:clamp(32px,3.4vw,46px);line-height:1.1}
.home-head .lede{font-size:16.5px}
.home-pub .home-head h2.display{font-size:clamp(26px,2.3vw,32px);line-height:1.15}
.home-pub .home-head .lede{font-size:15px;max-width:27em}
.filet{height:1px;border:0;margin:0;background:var(--line)}
.row-works{display:flex;justify-content:center;align-items:flex-end;gap:clamp(28px,6vw,88px)}
.row-works figure{margin:0;display:flex;flex-direction:column;gap:10px;min-width:0}
.row-works a{text-decoration:none}
.row-works img{height:clamp(200px,23vw,330px);width:auto;max-width:none;box-shadow:var(--hang);transition:transform .5s cubic-bezier(.2,.6,.2,1),box-shadow .5s}
.row-works a:hover img{transform:translateY(-4px);box-shadow:var(--hang-up)}
.row-works .t{font-family:var(--display);font-size:19px;line-height:1.25;margin-top:6px}
.row-works .m{font-size:13.5px;color:var(--muted)}
.home-links{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px 36px;margin-top:clamp(28px,3.5vw,48px)}
.link-caps.soft{color:var(--muted)}
.link-caps.strong{font-weight:600}
/* Publication : la couverture présentée comme un livre de trois quarts, tranche des pages visible */
.livre{--ep:28px;--ry:-34deg;position:relative;display:inline-block;isolation:isolate;perspective:1900px;padding:0 calc(var(--ep) + 6px) 0 0}
.livre-corps{position:relative;display:block;transform-style:preserve-3d;transform:rotateY(var(--ry));transition:transform .7s cubic-bezier(.2,.6,.2,1)}
.livre:hover .livre-corps{transform:rotateY(calc(var(--ry) + 8deg)) translateY(-4px)}
.livre-couv{position:relative;display:block;box-shadow:0 1px 1px rgba(23,22,20,.10),0 34px 44px -24px rgba(23,22,20,.50)}
.livre-couv::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,rgba(23,22,20,.20) 0,rgba(23,22,20,.05) 1.4%,rgba(255,255,255,.3) 2.4%,rgba(23,22,20,.05) 3.6%,rgba(23,22,20,0) 8%,rgba(255,255,255,.06) 100%)}
.row-works .livre img,.row-works .livre:hover img{display:block;height:clamp(300px,33vw,480px);width:auto;max-width:none;box-shadow:none;transform:none}
.livre-pages{position:absolute;top:4px;left:100%;width:var(--ep);height:calc(100% - 8px);transform-origin:left center;transform:rotateY(90deg);
  background:repeating-linear-gradient(90deg,#FBFAF6 0 1.5px,#CDC8BE 1.5px 2.5px),#EFECE6;box-shadow:inset 0 0 0 1px rgba(23,22,20,.06)}
.livre::after{content:"";position:absolute;z-index:-1;left:10%;right:14%;bottom:-16px;height:30px;background:radial-gradient(ellipse at center,rgba(23,22,20,.30),rgba(23,22,20,0) 70%);filter:blur(3px)}
@media (max-width:760px){.livre{--ep:18px}.row-works .livre img,.row-works .livre:hover img{height:auto;width:min(68vw,300px);max-height:none}}
@media (prefers-reduced-motion:reduce){.livre-corps{transition:none}}
@media (max-width:760px){.home-head{grid-template-columns:minmax(0,1fr)}.row-works{flex-direction:column;align-items:center;gap:40px}
  .row-works img{height:auto;max-width:100%;max-height:380px}.home-links{justify-content:flex-start}}
.home-quote{max-width:900px;margin-inline:auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:22px}
.home-quote p{margin:0;font-family:var(--display);font-style:italic;font-size:clamp(21px,2.3vw,29px);line-height:1.45;text-wrap:balance}
.home-quote .eyebrow{font-size:13px;letter-spacing:.26em}
@media (max-width:760px){.home-quote br{display:none}}

/* Quote */
.band{background:var(--panel)}
.quote{max-width:880px;margin-inline:auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:22px;padding-block:clamp(72px,9vw,112px)}
.quote p{margin:0;font-family:var(--display);font-style:italic;font-size:clamp(24px,2.8vw,34px);line-height:1.4;text-wrap:balance}

/* Cards */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:56px 32px}
@media (max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:44px 20px}}
@media (max-width:420px){.grid{gap:36px 14px}}
.card{text-decoration:none;display:flex;flex-direction:column;gap:14px;min-width:0}
.niche{position:relative;aspect-ratio:4/5;max-width:100%;background:var(--panel)}
.niche .fit{position:absolute;inset:13%;display:flex;align-items:center;justify-content:center}
.niche img{max-width:100%;max-height:100%;width:auto;height:auto;box-shadow:var(--hang);transition:transform .5s cubic-bezier(.2,.6,.2,1),box-shadow .5s}
.card:hover .niche img{transform:translateY(-4px);box-shadow:var(--hang-up)}
.card-meta{display:flex;flex-direction:column;gap:2px;min-width:0}
.card-title{font-family:var(--display);font-size:clamp(18px,1.7vw,22px);line-height:1.25}
.card-row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 12px}

/* Night band */
.night{background:var(--night);color:var(--on-night)}
.night .eyebrow{color:var(--on-night-2)}
.split{display:flex;flex-wrap:wrap;gap:48px 80px}
.split > *{flex:1 1 380px;min-width:0}
.chrono{list-style:none;margin:0;padding:0}
.chrono li{display:grid;grid-template-columns:110px minmax(0,1fr);gap:24px;padding-block:20px;border-top:1px solid var(--night-line)}
.chrono li:last-child{border-bottom:1px solid var(--night-line)}
.chrono b{font-family:var(--display);font-weight:400;font-size:23px;line-height:1.2}
.chrono span{color:var(--on-night-2)}
.night .link-caps{color:var(--on-night)}

/* Exhibition rows */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:150px minmax(0,2fr) minmax(0,1fr) minmax(0,1.2fr);gap:8px 24px;align-items:baseline;padding-block:22px;border-top:1px solid var(--line)}
.row:last-child{border-bottom:1px solid var(--line)}
.row-photos{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px;padding-top:10px}
.row-photos button{padding:0;border:0;background:var(--panel);cursor:zoom-in;line-height:0}
.row-photos img{height:clamp(84px,9vw,120px);width:auto;display:block;transition:opacity .2s}
.row-photos button:hover img{opacity:.82}
.portrait{margin:0;display:flex;flex-direction:column;gap:10px}
.portrait img{width:100%;height:auto;display:block;background:var(--panel)}
.row .ev{font-family:var(--display);font-size:clamp(19px,1.9vw,23px);line-height:1.3}
.row .muted{color:var(--muted);font-size:15px}
@media (max-width:760px){.row{grid-template-columns:minmax(0,1fr)}.row .ev{order:-1}}

/* Publication */
.pub{display:flex;flex-wrap:wrap;align-items:center;gap:48px 72px}
.book{flex:0 0 auto;width:min(300px,100%);aspect-ratio:3/4;background:var(--wall);box-shadow:16px 16px 0 var(--line),var(--hang);display:flex;flex-direction:column;justify-content:space-between;padding:28px}
.book img{width:58%;margin-inline:auto;box-shadow:0 1px 2px rgba(23,22,20,.15)}
.book .bt{font-family:var(--display);font-size:21px;text-align:center}
.pub .stack{flex:1 1 380px;min-width:0}
.pub-feature{justify-content:center;gap:48px clamp(56px,8vw,128px)}
.pub-feature .stack{flex:0 1 520px;gap:22px}
.pub-title{font-size:clamp(40px,5vw,66px);line-height:1.05}
.book-lg{width:min(360px,100%);text-decoration:none;color:var(--ink);box-shadow:2px 2px 0 var(--wall),3px 3px 0 var(--line),5px 5px 0 var(--wall),6px 6px 0 var(--line),var(--hang-up);transition:transform .5s cubic-bezier(.2,.6,.2,1)}
.book-lg:hover{transform:translateY(-6px) rotate(-.6deg)}

/* Footer */
.foot{background:linear-gradient(180deg,var(--wall) 0,#F1EFEA 72px);padding-block:72px 36px}
.foot-grid{display:flex;flex-wrap:wrap;justify-content:space-between;gap:48px}
.foot-grid > *{min-width:0}
.foot-nav{display:flex;flex-direction:column;gap:4px}
.foot-nav a{text-decoration:none;min-height:36px;display:flex;align-items:center}
.foot-nav a:hover{text-decoration:underline;text-underline-offset:4px}
.inline-field{display:flex;align-items:center;border-bottom:1px solid var(--ink)}
.inline-field input{flex:1;min-width:0;border:0;background:transparent;padding:12px 0;font-size:16px}
.inline-field input:focus-visible{outline:none}
.inline-field:focus-within{outline:2px solid var(--ink);outline-offset:4px}
.inline-field button{border:0;background:transparent;min-height:44px;cursor:pointer;font-size:12.5px;letter-spacing:.16em;text-transform:uppercase}
.legal{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;margin-top:56px;font-size:13px;color:var(--muted)}
.notice{font-size:14px;color:var(--ink-2);margin:0}

/* Pages */
.page-head{padding-block:clamp(40px,6vw,80px) clamp(24px,3vw,40px);display:flex;flex-direction:column;gap:16px}
.crumbs{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px}
.crumbs a{color:var(--muted)}

/* Catalogue */
.filters{display:flex;flex-direction:column;gap:14px;padding-block:22px;border-top:1px solid var(--ink);border-bottom:1px solid var(--line)}
.fgroup{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.flabel{flex:0 0 88px;font-size:11.5px;font-weight:400;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
@media (max-width:560px){.flabel{flex-basis:100%}}
.chip{min-height:44px;padding:0 16px;border:1px solid var(--line);background:transparent;color:var(--ink-2);font-size:14px;font-weight:400;cursor:pointer;transition:border-color .2s,background .2s}
.chip:hover{border-color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--wall);border-color:var(--ink)}
.chip small{font-size:12px;opacity:.7;margin-left:6px;font-variant-numeric:tabular-nums}
.toolbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px;padding-block:20px 40px}
.count{font-size:15px;color:var(--ink-2)}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.seg{display:inline-flex;border:1px solid var(--line)}
.seg button{min-height:44px;padding:0 16px;border:0;background:transparent;cursor:pointer;font-size:14px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--wall)}
.select{display:inline-flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.select select{min-height:44px;padding:0 12px;border:1px solid var(--line);background:var(--wall);font-size:14px;color:var(--ink);border-radius:0}
.empty{padding-block:48px;display:flex;flex-direction:column;align-items:flex-start;gap:16px}
.empty p{margin:0;font-family:var(--display);font-size:25px}

/* Work page */
.work-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px 24px;padding-block:28px}
.pager{display:flex;align-items:center;gap:20px;font-size:14px}
.pager a{text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.pager a:hover{text-decoration:underline;text-underline-offset:4px}
.work{display:flex;flex-wrap:wrap;gap:40px clamp(40px,5vw,80px);align-items:flex-start;padding-bottom:clamp(72px,9vw,112px)}
.work-main{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:14px}
.work-side{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:28px}
.stage{background:var(--panel);display:flex;justify-content:center;align-items:center;padding:clamp(28px,5vw,72px)}
.stage button{border:0;padding:0;background:none;cursor:zoom-in;max-width:100%}
.stage img{max-height:min(68vh,760px);width:auto;height:auto;max-width:100%;box-shadow:var(--hang)}
.view-tabs{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.scale{position:relative;width:100%;max-width:100%;aspect-ratio:340/260;background:var(--panel);overflow:hidden;border-bottom:6px solid var(--line)}
.scale .art{position:absolute;box-shadow:var(--hang)}
.scale .person{position:absolute;left:5%;bottom:0;height:calc(175 / 260 * 100%);width:auto;fill:var(--figure)}
.scale-legend{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px;font-size:13px;color:var(--muted)}
.facts{margin:0;display:grid;grid-template-columns:120px minmax(0,1fr)}
.facts dt,.facts dd{margin:0;padding-block:13px;border-top:1px solid var(--line)}
.facts dt{color:var(--muted);font-size:14px}
.facts dd{font-size:15px}
.facts dt:nth-last-of-type(1),.facts dd:last-of-type{border-bottom:1px solid var(--line)}
.cta-col{display:flex;flex-direction:column;gap:12px}
.cta-col .btn{width:100%}
.hint{font-size:13px;color:var(--muted);margin:0}

/* Bio */
.bio-intro{font-family:var(--display);font-size:clamp(22px,2.3vw,29px);line-height:1.45;margin:0;max-width:30em;text-wrap:pretty}
.bio{display:flex;flex-wrap:wrap;gap:56px clamp(48px,6vw,96px);align-items:flex-start;padding-bottom:clamp(72px,9vw,112px)}
.bio .timeline{flex:999 1 520px;min-width:0}
.bio aside{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:14px}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:grid;grid-template-columns:170px minmax(0,1fr);gap:8px 28px;padding-block:24px;border-top:1px solid var(--line)}
.timeline li:last-child{border-bottom:1px solid var(--line)}
.timeline b{font-family:var(--display);font-weight:400;font-size:20px;line-height:1.3}
.timeline p{margin:0;color:var(--ink-2);max-width:36em}
@media (max-width:560px){.timeline li{grid-template-columns:minmax(0,1fr)}}

/* Contact */
.contact{display:flex;flex-wrap:wrap;gap:56px clamp(48px,7vw,112px);align-items:flex-start;padding-bottom:clamp(72px,9vw,112px)}
.contact form,.contact .done{flex:999 1 520px;min-width:0}
.contact aside{flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:28px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 24px}
.form .full{grid-column:1 / -1}
@media (max-width:560px){.form{grid-template-columns:minmax(0,1fr)}}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:11.5px;font-weight:400;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;border:0;border-bottom:1px solid var(--muted);background:transparent;padding:12px 0;font-size:16px;border-radius:0}
.field select{background:var(--wall)}
.field textarea{resize:vertical;min-height:120px}
.field input:focus-visible,.field select:focus-visible,.field textarea:focus-visible{outline:none;border-bottom:2px solid var(--ink);padding-bottom:11px}
.done{display:flex;flex-direction:column;gap:18px;padding:40px;background:var(--panel)}
.done p{margin:0}
.addr{display:flex;flex-direction:column;gap:6px}
.addr .eyebrow{margin-bottom:6px}

.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.form-err{margin:0;color:var(--error);font-size:14px}

/* Lightbox */
.lb{position:fixed;inset:0;z-index:50;background:#141311;color:#ECEAE5;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.lb-bar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.lb-btn{min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid #3A3733;background:transparent;color:#ECEAE5;cursor:pointer;padding:0 14px;font-size:13px;letter-spacing:.08em}
.lb-btn:hover{border-color:#8C877F}
.lb-btn:focus-visible{outline-color:#ECEAE5}
.lb-stage{position:relative;overflow:hidden}
.lb-fit{position:absolute;inset:8px 72px;display:flex;align-items:center;justify-content:center}
@media (max-width:640px){.lb-fit{inset:8px 16px}}
.lb-img{max-width:100%;max-height:100%;width:auto;height:auto;cursor:zoom-in;transition:transform .35s cubic-bezier(.2,.6,.2,1)}
.lb-img.zoomed{transform:scale(2.6);cursor:zoom-out}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:2}
.lb-prev{left:max(12px,env(safe-area-inset-left,0px))}
.lb-next{right:max(12px,env(safe-area-inset-right,0px))}
@media (max-width:640px){.lb-nav{top:auto;bottom:12px;transform:none}}
.lb-cap{display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:6px 20px;padding:14px 16px 18px}
.lb-cap .t{font-family:var(--display);font-size:19px}
.lb-cap .cartel{color:#A9A49C}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{transition:none !important;animation:none !important}
}
</style>

<script id="site-data" type="application/json">__DATA__</script>
<script>
(function(){
  /* Toutes les données viennent de l'administration (dossier content/), assemblées par build.mjs. */
  var DATA = JSON.parse(document.getElementById('site-data').textContent);
  var SITE = DATA.site, WORKS = DATA.works, SERIES = DATA.series, YEARS = DATA.years, HERO = DATA.hero;
  var EXPO = DATA.expositions, BIO = DATA.biographie, SECTIONS = DATA.accueil;
  var TECH_SHORT = {'Huile sur toile':'Huiles', 'Encre de Chine sur papier':'Encres', 'Feutre sur papier':'Feutres', 'Dessin':'Dessins', 'Autre':'Autres'};

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function inline(s){ return esc(s).replace(/\*([^*\n]+)\*/g, '<em>$1</em>').replace(/\n/g, '<br>'); }
  function plain(s){ return String(s || '').replace(/\*/g, '').replace(/\s*\n\s*/g, ' ').trim(); }
  function paras(s){ return String(s || '').split(/\n\s*\n/).filter(function(p){ return p.trim(); }).map(function(p){ return '<p>' + inline(p.trim()) + '</p>'; }).join(''); }
  function fnum(n){ return String(n).replace('.', ','); }
  function rank(n){ var m = String(n).match(/(\d+)(?!.*\d)/); return m ? +m[1] : 0; }

  WORKS.forEach(function(w){ w.f = fnum(w.h) + ' × ' + fnum(w.w); });
  var byN = {}; WORKS.forEach(function(w){ byN[w.slug] = w; });
  var TECHS = []; WORKS.forEach(function(w){ if (TECHS.indexOf(w.tech) < 0) TECHS.push(w.tech); });

  var st = {cat:'huiles', serie:'Toutes', annee:'Toutes', format:'Tous', tech:'Toutes', tri:'recent', mode:'mur', tab:'oeuvre',
            ask:null, askLabel:'', objet:null, sent:null, browse: 'series'};
  function setCat(c){
    if (!CATS.some(function(x){ return x[0] === c; })) return;
    if (st.cat !== c) { st.cat = c; st.serie = 'Toutes'; st.annee = 'Toutes'; st.format = 'Tous'; st.tech = 'Toutes'; st.browse = catBrowses(c)[0][0]; }
  }
  var view = document.getElementById('view');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function sizeCat(w){ var m = Math.max(w.h, w.w); return m >= 121 ? 'Grand' : (m >= 74 ? 'Moyen' : 'Petit'); }
  function cartel(w){ return w.n + ' ' + fnum(w.h) + 'X' + fnum(w.w) + ' ' + w.y + '.'; }
  function alt(w){ return w.t + ', ' + w.y + '. ' + w.tech + ', ' + w.f + ' cm.'; }
  // Les ensembles « Encres de Chine » et « Dessins » ne sont pas des séries au sens des huiles.
  var GROUPES = {'Encres de Chine':1, 'Dessins':1};
  // Les œuvres sont rangées en trois parties, comme sur l'ancien site : huiles, encres, dessins.
  var CATS = [['huiles', 'Huiles'], ['encres', 'Encres de Chine'], ['dessins', 'Dessins']];
  function catOf(w){
    if (w.s === 'Dessins' || w.tech === 'Dessin' || w.tech === 'Feutre sur papier') return 'dessins';
    if (w.tech === 'Encre de Chine sur papier' || w.s === 'Encres de Chine') return 'encres';
    return 'huiles';
  }
  WORKS.forEach(function(w){ w.cat = catOf(w); });
  CATS = CATS.filter(function(c){ return WORKS.some(function(w){ return w.cat === c[0]; }); });
  function catName(c){ var f = CATS.filter(function(x){ return x[0] === c; })[0]; return f ? f[1] : 'Œuvres'; }
  function catSeries(){ return SERIES.filter(function(s){ return !GROUPES[s.nom] && WORKS.some(function(w){ return w.cat === 'huiles' && w.s === s.nom; }); }); }
  function catYears(c){ return YEARS.filter(function(y){ return WORKS.some(function(w){ return w.cat === c && String(w.y) === y.nom; }); }); }
  function catBrowses(c){ return c === 'huiles' ? [['series', 'Par série'], ['annees', 'Par année'], ['tout', 'Toutes les huiles']].filter(function(b){ return b[0] !== 'series' || catSeries().length; })
    : c === 'encres' ? [['annees', 'Par année'], ['tout', 'Toutes les encres']] : [['tout', 'Tous les dessins']]; }
  var FILTRES_OUVERTS = true;
  try { FILTRES_OUVERTS = localStorage.getItem('rp-filtres') !== 'caches'; } catch (e) {}
  if (CATS.length) { st.cat = CATS[0][0]; st.browse = catBrowses(st.cat)[0][0]; }
  function serieLabel(w){ return w.s ? (GROUPES[w.s] ? w.s : 'Série ' + w.s) : (TECH_SHORT[w.tech] || w.tech); }
  function plural(n){ return n + (n > 1 ? ' œuvres' : ' œuvre'); }
  function srcset(w){ return 'img/o/' + w.slug + '-s.jpg ' + w.sw + 'w, img/o/' + w.slug + '.jpg ' + w.fw + 'w'; }
  function img(w, sizes, extra){
    return '<img src="img/o/' + w.slug + '-s.jpg" srcset="' + srcset(w) + '" sizes="' + sizes + '" width="' + w.fw + '" height="' + w.fh + '" alt="' + esc(alt(w)) + '" decoding="async" style="background:' + w.bg + '" ' + (extra || 'loading="lazy"') + '>';
  }
  function card(w){
    return '<a class="card" href="#oeuvre-' + w.slug + '"><div class="niche"><div class="fit">' + img(w, '(max-width:900px) 38vw, 26vw') + '</div></div>' +
      '<div class="card-meta"><div class="card-row"><span class="card-title">' + esc(w.t) + '</span><span style="font-size:14px;color:var(--muted)">' + w.y + '</span></div><span class="cartel">' + esc(cartel(w)) + '</span></div></a>';
  }
  function coverImg(c, sizes, eager){
    var w = byN[c.slug];
    return '<img src="img/o/' + w.slug + '.jpg" srcset="' + srcset(w) + '" sizes="' + sizes + '" alt="" decoding="async" ' + (eager ? '' : 'loading="lazy" ') + 'style="object-position:' + c.pos + ';background:' + w.bg + '">';
  }
  function serieTile(s, n){
    return '<a class="cover" href="#oeuvres" data-serie="' + esc(s.nom) + '"><div class="cover-img">' + coverImg(s.cover, '(max-width:520px) 92vw, (max-width:900px) 46vw, 30vw') + '</div>' +
      '<div class="cover-meta"><span class="card-title">' + esc(s.nom) + '</span><span class="muted">' + esc(s.annees) + (s.annees ? ' · ' : '') + plural(n == null ? s.count : n) + '</span></div></a>';
  }
  function yearTile(y, n){
    return '<a class="cover" href="#oeuvres" data-annee="' + y.nom + '"><div class="cover-img">' + coverImg(y.cover, '(max-width:520px) 92vw, (max-width:900px) 46vw, 30vw') + '</div>' +
      '<div class="cover-meta"><span class="card-title">' + y.nom + '</span><span class="muted">' + plural(n == null ? y.count : n) + '</span></div></a>';
  }
  function crumbs(items){

  /* Diaporama de l'en-tête : une toile toutes les HERO.duree secondes, en fondu */
  var show = null;
  function startShow(){
    if (show) { clearTimeout(show.timer); show = null; }
    var m = view.querySelector('.mast');
    if (!m || !HERO || HERO.slides.length < 2) return;
    var imgs = m.querySelectorAll('.mast-slide'), dots = m.querySelectorAll('.mast-dots button');
    var count = m.querySelector('.mast-count'), credit = m.querySelector('.mast-credit'), pauseBtn = m.querySelector('.mast-pause');
    var n = imgs.length, pad = function(k){ return (k < 10 ? '0' : '') + k; };
    show = {i: 0, paused: !!reduce, timer: null};
    if (show.paused) { m.classList.add('is-still'); pauseBtn.setAttribute('aria-pressed', 'true'); pauseBtn.setAttribute('aria-label', 'Lancer le diaporama'); }
    function load(k, cb){
      var im = imgs[k];
      if (im.dataset.src) { im.src = im.dataset.src; im.removeAttribute('data-src'); }
      if (im.complete && im.naturalWidth) cb(); else { im.addEventListener('load', cb, {once:true}); im.addEventListener('error', cb, {once:true}); }
    }
    function go(k){
      k = (k + n) % n;
      load(k, function(){
        if (!show) return;
        imgs[show.i].classList.remove('is-on'); imgs[k].classList.add('is-on');
        dots.forEach(function(d, j){ if (j === k) d.setAttribute('aria-current', 'true'); else d.removeAttribute('aria-current'); });
        var x = HERO.slides[k], w = byN[x.slug];
        m.classList.toggle('tone-dark', x.tone === 'dark'); m.classList.toggle('tone-light', x.tone !== 'dark');
        count.textContent = pad(k + 1) + ' / ' + pad(n);
        if (w) { credit.href = '#oeuvre-' + w.slug; credit.textContent = w.t + ', ' + w.y + ' (détail) →'; }
        show.i = k; updateTop(); schedule();
        load((k + 1) % n, function(){});
      });
    }
    function schedule(){ clearTimeout(show.timer); if (!show.paused && !document.hidden) show.timer = setTimeout(function(){ go(show.i + 1); }, HERO.duree * 1000); }
    function restart(){ var a = dots[show.i]; if (!a) return; a.removeAttribute('aria-current'); void a.offsetWidth; a.setAttribute('aria-current', 'true'); }
    show.schedule = schedule; show.restart = restart;
    dots.forEach(function(d, j){ d.addEventListener('click', function(){ if (j !== show.i) go(j); }); });
    pauseBtn.addEventListener('click', function(){
      show.paused = !show.paused; m.classList.toggle('is-paused', show.paused); m.classList.remove('is-still');
      pauseBtn.setAttribute('aria-pressed', String(show.paused));
      pauseBtn.setAttribute('aria-label', show.paused ? 'Lancer le diaporama' : 'Mettre le diaporama en pause');
      pauseBtn.innerHTML = show.paused ? '<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 1l7 4-7 4z" fill="currentColor"/></svg>' : '<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 1h2v8H2zM6 1h2v8H6z" fill="currentColor"/></svg>';
      if (!show.paused) restart();
      schedule();
    });
    load(1, function(){});
    schedule();
  }
  document.addEventListener('visibilitychange', function(){
    if (!show) return;
    if (document.hidden) clearTimeout(show.timer); else { show.restart(); show.schedule(); }
  });

  /* Catalogue des œuvres */
  function matches(w, except){
    return w.cat === st.cat &&
      (except === 'serie' || st.serie === 'Toutes' || (st.serie === 'À préciser' ? !w.s : w.s === st.serie)) &&
      (except === 'annee' || st.annee === 'Toutes' || String(w.y) === st.annee) &&
      (except === 'tech' || st.tech === 'Toutes' || w.tech === st.tech) &&
      (except === 'format' || st.format === 'Tous' || sizeCat(w) === st.format);
  }
  function pool(except){ return WORKS.filter(function(w){ return matches(w, except); }); }
  function filtered(){
    var list = pool(null);
    list.sort(function(a, b){
      var na = rank(a.n), nb = rank(b.n);
      if (st.tri === 'ancien') return a.y - b.y || na - nb;
      if (st.tri === 'grand') return (b.h * b.w) - (a.h * a.w) || b.y - a.y;
      return b.y - a.y || nb - na;
    });
    return list;
  }
  function chips(key, values, opts){
    opts = opts || {};

    }).join('');
  }

  var VIEWS = {accueil:home, oeuvres:oeuvresPage, expositions:expositions, biographie:biographie, contact:contact};

  /* Échelle : un centimètre de toile en pixels, ajusté à la largeur disponible */

      var hang = el.querySelector('.hang'); if (!hang) return;
      var total = +el.dataset.total, max = +el.dataset.max || 2.4, W = hang.clientWidth, k;
      if (el.dataset.wrap) { k = Math.min(max, W / total); }

  }
  window.addEventListener('resize', function(){ fit(); updateTop(); });

  /* Navigation */

  /* Visionneuse */

      st.annee = 'Toutes'; st.format = 'Tous'; st.tech = 'Toutes'; st.browse = 'tout';
    }
    var y = t.closest('[data-annee]');
    if (y) { st.annee = y.dataset.annee; st.serie = 'Toutes'; st.format = 'Tous'; st.tech = 'Toutes'; st.browse = 'tout'; }
    if (t.closest('[data-scale]')) { setCat('huiles'); st.serie = 'Toutes'; st.annee = 'Toutes'; st.format = 'Tous'; st.tech = 'Toutes'; st.browse = 'tout'; st.mode = 'echelle'; }
    var a = t.closest('a[href^="#"]');
    if (a) {
      var href = a.getAttribute('href');
      if (href === '#contact') { st.ask = a.dataset.ask || null; st.askLabel = a.dataset.label || ''; st.objet = a.dataset.objet || null; st.sent = null; }
      if (href === location.hash || (href === '#accueil' && !location.hash)) { e.preventDefault(); currentKey = ''; render(false); }
    }
  });
  document.addEventListener('change', function(e){
    if (e.target.id === 'tri') { st.tri = e.target.value; rerender('#tri'); }
  });

  /* Formulaire de contact : envoyé par Web3Forms à l'adresse liée à la clé saisie dans l'administration.
     Sans clé, il passe par Netlify Forms (seulement sur un site hébergé par Netlify). */
  var FORM_ENDPOINT = 'https://api.web3forms.com/submit';
  function sendForm(form){
    var f = form.elements, key = SITE.contact.cle;
    if (f['bot-field'] && f['bot-field'].value) return Promise.resolve();
    if (key) {
      var objet = f.objet.value || 'Message';
      var payload = {
        access_key: key,
        subject: SITE.nom + ' · ' + objet + ' · ' + f.nom.value.trim(),
        from_name: 'Site ' + SITE.nom,
        'Nom': f.nom.value.trim(),
        email: f.mail.value.trim(),
        'Objet': objet,
        'Téléphone': f.tel.value.trim(),
        'Œuvre concernée': f.oeuvre.value.trim(),
        'Message': f.msg.value
      };
      return fetch(FORM_ENDPOINT, {method:'POST', headers:{'Content-Type':'application/json', 'Accept':'application/json'}, body:JSON.stringify(payload)})
        .then(function(r){
          return r.json().catch(function(){ return {}; }).then(function(j){
            if (!r.ok || j.success === false) throw new Error(j.message || ('HTTP ' + r.status));
          });
        });
    }
    if (!/\.netlify\.app$/.test(location.hostname)) return Promise.reject(new Error('non-configure'));
    return fetch('/', {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:new URLSearchParams(new FormData(form)).toString()})
      .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); });
  }
  document.addEventListener('submit', function(e){
    e.preventDefault();
    var form = e.target, btn = form.querySelector('[type="submit"]');
    if (form.id !== 'contact-form') return;
    var err = document.getElementById('c-err'), label = btn.textContent;
    err.hidden = true; btn.disabled = true; btn.textContent = 'Envoi en cours…';
    sendForm(form).then(function(){
      st.sent = (form.elements.nom.value || '').trim().split(' ')[0] || '';
      rerender(null);
      var d = view.querySelector('.done'); if (d) { d.setAttribute('tabindex', '-1'); d.focus(); }
    }).catch(function(e){
      btn.disabled = false; btn.textContent = label;
      var mail = SITE.contact.email;
      err.textContent = e && e.message === 'non-configure'
        ? 'Le formulaire n\'est pas encore relié à une adresse e-mail.' + (mail ? ' Écrivez directement à ' + mail + '.' : '')
        : 'Le message n\'est pas parti. Vérifiez votre connexion et réessayez dans un instant.' + (mail ? ' Vous pouvez aussi écrire à ' + mail + '.' : '');
      err.hidden = false;
    });
  });

  chrome();
  render(false);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
</body>
</html>
