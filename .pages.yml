# Administration (Pages CMS) du site de Rémy Pollet.
# Chaque enregistrement met le site à jour en une à deux minutes (hébergement Cloudflare Pages).
# Ce fichier ne se modifie que depuis GitHub (la page Settings de l'administration est masquée).

settings:
  hide: true
  commit:
    identity: user
    templates:
      create: "Ajout : {path}"
      update: "Modification : {path}"
      delete: "Suppression : {path}"
      rename: "Renommage : {oldPath} -> {newPath}"

media:
  - name: oeuvres
    label: Photos des œuvres
    input: media/oeuvres
    output: /media/oeuvres
    categories: [image]
  - name: images
    label: Autres images
    input: media/images
    output: /media/images
    categories: [image]

components:
  cadrage:
    type: select
    options:
      values:
        - { name: haut, label: "Haut de la toile" }
        - { name: haut-centre, label: "Entre le haut et le centre" }
        - { name: centre, label: "Centre de la toile" }
        - { name: centre-bas, label: "Entre le centre et le bas" }
        - { name: bas, label: "Bas de la toile" }
  choix_oeuvre:
    type: reference
    options:
      collection: huiles
      value: "{numero}"
      label: "n° {numero} · {titre} · {annee}"
      search: "numero,titre,serie"

content:
  - name: aide
    label: "Mode d'emploi"
    type: file
    path: content/aide.json
    format: json
    operations:
      delete: false
    fields:
      - { name: commencer, label: "Pour commencer", type: text, readonly: true }
      - { name: ajouter, label: "Ajouter une œuvre", type: text, readonly: true }
      - { name: retirer, label: "Corriger ou retirer une œuvre", type: text, readonly: true }
      - { name: series, label: "Les séries", type: text, readonly: true }
      - { name: accueil, label: "La page d'accueil", type: text, readonly: true }
      - { name: textes, label: "Écrire un texte", type: text, readonly: true }
      - { name: probleme, label: "En cas de doute", type: text, readonly: true }

  - name: huiles
    label: Huiles
    type: collection
    path: content/oeuvres/huiles
    format: json
    filename: "{fields.numero}.json"
    operations:
      rename: false
      delete: false
    view:
      fields: [numero, titre, serie, annee]
      primary: numero
      sort: [annee, numero, serie]
      search: [numero, titre, serie]
      default:
        sort: annee
        order: desc
    fields:
      - name: photo
        label: Photo
        type: image
        required: true
        description: "Envoyez la photo du photographe telle quelle : le fond blanc et le cartel sont retirés automatiquement."
        options:
          media: oeuvres
      - name: deja_recadree
        label: Photo déjà recadrée
        type: boolean
        description: "Laissez décoché pour une photo du photographe. Cochez seulement si la photo montre l'œuvre seule, sans fond blanc ni cartel (c'est le cas des encres et des dessins repris de l'ancien site)."
      - name: rotation
        label: Tourner la photo (facultatif)
        type: select
        description: "Pour redresser une photo couchée ou montrer l'œuvre dans l'autre sens. Laissez vide si la photo est dans le bon sens. La hauteur et la largeur affichées suivent le sens de la photo."
        options:
          values:
            - { name: droite, label: "Un quart de tour vers la droite" }
            - { name: gauche, label: "Un quart de tour vers la gauche" }
            - { name: demi-tour, label: "Demi-tour (tête en bas)" }
      - name: numero
        label: Numéro
        type: string
        required: true
        description: "Le numéro inscrit sur le cartel. Exemple : 581."
      - name: serie
        label: Série
        type: reference
        description: "Choisissez dans la liste. Laissez vide si l'œuvre n'appartient à aucune série."
        options:
          collection: series
          value: "{nom}"
          label: "{nom}"
      - name: annee
        label: Année
        type: number
        required: true
        description: "Exemple : 2025."
        options:
          min: 1950
          max: 2100
      - name: hauteur
        label: Hauteur en cm
        type: number
        required: true
        description: "Le premier chiffre du format. Pour 146 × 114, tapez 146."
        options:
          min: 1
          max: 1000
      - name: largeur
        label: Largeur en cm
        type: number
        required: true
        description: "Le second chiffre du format. Pour 146 × 114, tapez 114."
        options:
          min: 1
          max: 1000
      - name: titre
        label: Titre (facultatif)
        type: string
        description: "Laissez vide pour reprendre le nom de la série."
      - name: technique
        label: Technique (facultatif)
        type: select
        description: "Laissez vide pour « Huile sur toile »."
        options:
          values: [Huile sur toile, Encre de Chine sur papier, Feutre sur papier, Dessin, Autre]
      - name: disponibilite
        label: Disponibilité (facultatif)
        type: select
        description: "Laissez vide pour ne rien afficher sur le site."
        options:
          values: [Disponible, Réservée, Vendue, Collection privée, Sur demande]
      - name: texte
        label: Texte sur l'œuvre (facultatif)
        type: text
        description: "Affiché sur la fiche de l'œuvre. Une ligne vide sépare deux paragraphes."
      - name: masquer
        label: Masquer du site
        type: boolean
        description: "Cochez pour retirer l'œuvre du site. Décochez pour la remettre. Rien n'est effacé."

