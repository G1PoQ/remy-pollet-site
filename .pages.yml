        label: Description (facultatif)
        type: text
        description: "Affichée sur le bandeau de la série."

  - name: pages
    label: Pages du site
    type: group
    items:
      - name: accueil
        label: Accueil
        type: file
        path: content/accueil.json
        format: json
        operations:
          delete: false
        fields:
          - name: sections
            label: Sections de la page d'accueil
            description: "Elles s'affichent sous l'en-tête, dans cet ordre. Vous pouvez changer leur ordre. Pour en enlever une sans la perdre, cochez « Masquer cette section »."
            type: block
            blockKey: type
            list:
              collapsible:
                collapsed: true
                summary: "{type} · {titre}"
            blocks:
              - name: accrochage
                label: "Accrochage à l'échelle"
                fields:
                  - { name: surtitre, label: Petit titre, type: string }
                  - { name: titre, label: Titre, type: text, description: "Pour mettre un mot en italique, entourez-le d'astérisques : *le noir*." }
                  - { name: texte, label: Texte, type: text }
                  - name: oeuvres
                    label: Œuvres accrochées (de 2 à 6)
                    type: reference
                    options:
                      collection: huiles
                      multiple: true
                      max: 6
                      value: "{numero}"
                      label: "n° {numero} · {titre} · {annee}"
                      search: "numero,titre,serie"
                  - { name: lien_formats, label: "Afficher le lien « Comparer tous les formats »", type: boolean }
                  - { name: masquer, label: Masquer cette section, type: boolean }
              - name: catalogue
                label: "Catalogue / publication"
                fields:
                  - { name: surtitre, label: Petit titre, type: string }
                  - { name: titre, label: Titre, type: text, description: "Pour mettre un mot en italique, entourez-le d'astérisques." }
                  - { name: texte, label: Texte, type: text }
                  - { name: lien, label: Lien vers le catalogue en ligne, type: string }
                  - { name: libelle_bouton, label: Texte du bouton, type: string }
                  - name: couverture
                    label: Photo de la couverture (facultatif)
                    type: image
                    description: "Sans photo, une couverture est composée avec l'œuvre choisie ci-dessous."
                    options:
                      media: images
                  - { name: oeuvre, label: Œuvre pour la couverture, component: choix_oeuvre }
                  - { name: exemplaire, label: "Afficher « Demander un exemplaire »", type: boolean }
                  - { name: masquer, label: Masquer cette section, type: boolean }
              - name: citation
                label: Citation
                fields:
                  - { name: texte, label: Citation (sans guillemets), type: text }
                  - { name: auteur, label: Auteur, type: string }
                  - { name: masquer, label: Masquer cette section, type: boolean }
              - name: parcours
                label: "Parcours (fond sombre)"
                fields:
                  - { name: surtitre, label: Petit titre, type: string }
                  - { name: titre, label: Titre, type: text }
                  - { name: texte, label: Texte, type: text }
                  - name: etapes
                    label: Dates clés
                    type: object
                    list:
                      collapsible:
                        collapsed: true
                        summary: "{annee} · {texte}"
                    fields:
                      - { name: annee, label: Année, type: string }
                      - { name: texte, label: Texte, type: string }
                  - { name: lien_bio, label: "Afficher le lien « Lire la biographie »", type: boolean }
                  - { name: masquer, label: Masquer cette section, type: boolean }
              - name: texte
                label: "Texte libre (avec image)"
                fields:
                  - { name: surtitre, label: Petit titre, type: string }
                  - { name: titre, label: Titre, type: text }
                  - { name: texte, label: Texte, type: text, description: "Une ligne vide sépare deux paragraphes." }
                  - name: image
                    label: Image (facultatif)
                    type: image
                    options:
                      media: images
                  - name: fond
                    label: Couleur du fond
                    type: select
                    options:
                      values: [Clair, Gris, Sombre]
                  - { name: masquer, label: Masquer cette section, type: boolean }
              - name: oeuvres
                label: "Sélection d'œuvres"
                fields:
                  - { name: titre, label: Titre, type: text }
                  - name: oeuvres
                    label: Œuvres choisies
                    type: reference
                    description: "Laissez vide pour montrer les plus récentes."
                    options:
                      collection: huiles
                      multiple: true
                      value: "{numero}"
                      label: "n° {numero} · {titre} · {annee}"
                      search: "numero,titre,serie"
                  - { name: nombre, label: Nombre d'œuvres récentes, type: number, description: "Utilisé si aucune œuvre n'est choisie. 3 si vide." }
                  - { name: masquer, label: Masquer cette section, type: boolean }
              - name: series
                label: "Les séries (images de présentation)"
                fields:
                  - { name: titre, label: Titre, type: text }
                  - { name: masquer, label: Masquer cette section, type: boolean }
              - name: expositions
                label: "Dernières expositions"
                fields:
                  - { name: titre, label: Titre, type: text }
                  - { name: nombre, label: Nombre d'expositions, type: number, description: "4 si vide." }
                  - { name: masquer, label: Masquer cette section, type: boolean }

      - name: biographie
        label: Biographie
        type: file
        path: content/biographie.json
        format: json
        operations:
          delete: false
        fields:
          - { name: intro, label: Introduction, type: text }
          - name: etapes
            label: Étapes (dans l'ordre chronologique)
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{periode}"
            fields:
              - { name: periode, label: Date ou période, type: string, description: "Exemple : 1972, ou « Années 1980 »." }
              - { name: texte, label: Texte, type: text }
          - { name: portrait, label: Portrait (facultatif), type: image, options: { media: images } }
          - { name: legende_portrait, label: Légende du portrait (facultatif), type: string }
          - { name: oeuvre, label: Œuvre affichée à côté, component: choix_oeuvre }

      - name: expositions
        label: Expositions
        type: file
        path: content/expositions.json
        format: json
        operations:
          delete: false
        fields:
          - { name: intro, label: Introduction, type: text }
          - name: liste
            label: Expositions (la plus récente en premier)
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{date} · {titre}"
            fields:
              - { name: date, label: Date, type: string, description: "Exemple : « 3 – 25 oct. 2020 »." }
              - { name: titre, label: Titre, type: string }
              - { name: lieu, label: Ville, type: string }
              - { name: organisateur, label: Galerie ou organisateur, type: string }
              - { name: photos, label: Photos (facultatif), type: image, list: true, options: { media: images }, description: "Vues de l'exposition. Elles s'affichent en vignettes sous la ligne et s'agrandissent au clic." }

  - name: reglages_groupe
    label: Réglages
    type: group
    items:
      - name: reglages
        label: Réglages du site
        type: file
        path: content/site.json
        format: json
        operations:
          delete: false
        fields:
          - { name: nom, label: Nom affiché, type: string, required: true }
          - { name: sous_titre, label: Sous-titre de l'en-tête, type: string }
          - name: entete
            label: Toile de l'en-tête
            type: object
            fields:
              - { name: oeuvre, label: Œuvre en fond, component: choix_oeuvre }
              - { name: position, label: Partie de la toile montrée, component: cadrage, description: "La couleur du texte s'adapte toute seule à la toile." }
          - name: contact
            label: Coordonnées de l'atelier
            type: object
            fields:
              - { name: email, label: E-mail, type: string }
              - { name: telephone, label: Téléphone, type: string }
              - { name: adresse, label: Adresse, type: text }
              - { name: visites, label: Visites, type: string, description: "Exemple : « Visites sur rendez-vous »." }
              - { name: instagram, label: Lien Instagram, type: string }
              - { name: intro, label: Texte de la page Contact, type: text }
              - { name: cle_formulaire, label: "Clé du formulaire (ne pas modifier)", type: string, description: "Clé Web3Forms : les messages de la page Contact arrivent à l'adresse liée à cette clé." }
          - name: menu
            label: Menu
            type: object
            description: "Les entrées du menu, dans l'ordre d'affichage."
            list:
              collapsible:
                collapsed: true
                summary: "{libelle}"
            fields:
              - { name: libelle, label: Texte affiché, type: string, required: true }
              - name: cible
                label: Page
                type: select
                options:
                  values:
                    - { name: accueil, label: Accueil }
                    - { name: oeuvres, label: Œuvres }
                    - { name: expositions, label: Expositions }
                    - { name: biographie, label: Biographie }
                    - { name: contact, label: Contact }
                    - { name: lien, label: Lien vers un autre site }
              - { name: lien, label: Adresse du lien, type: string, description: "Seulement pour « Lien vers un autre site »." }
              - { name: bouton, label: Afficher comme un bouton encadré, type: boolean }
          - name: polices
            label: Polices
            type: object
            fields:
              - name: titres
                label: Police des titres
                type: select
                options:
                  values:
                    - { name: palatino, label: "Palatino (classique)" }
                    - { name: cormorant, label: "Cormorant Garamond (fine, élégante)" }
                    - { name: garamond, label: "EB Garamond (livre)" }
                    - { name: caslon, label: "Libre Caslon (éditoriale)" }
              - name: texte
                label: Police du texte
                type: select
                options:
                  values:
                    - { name: hanken, label: "Hanken Grotesk (sobre)" }
                    - { name: jost, label: "Jost (géométrique)" }
                    - { name: source, label: "Source Sans (neutre)" }
          - { name: pied_de_page, label: Mention en bas de page, type: string }
          - name: referencement
            label: Référencement (Google)
            type: object
            fields:
              - { name: titre, label: Titre de la page, type: string }
              - { name: description, label: Description, type: text }
              - { name: visible_google, label: Visible sur Google, type: boolean, description: "À cocher au lancement définitif du site." }

      - name: annees
        label: Images des années
        type: file
        path: content/annees.json
        format: json
        list: true
        operations:
          delete: false
        fields:
          - { name: annee, label: Année, type: string, required: true }
          - { name: presentation, label: Image de présentation, component: choix_oeuvre }
          - { name: cadrage, label: Partie de la toile montrée, component: cadrage }
