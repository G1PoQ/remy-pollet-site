# Configuration de l'administration (Pages CMS) du site de Rémy Pollet.
# Chaque modification enregistrée dans l'administration met le site à jour en une à deux minutes.

media:
  - name: oeuvres
    label: Photos des œuvres
    input: media/oeuvres
    output: /media/oeuvres
    categories: [image]
  - name: images
    label: Autres images
    input: media/images
    output: /media/images
    categories: [image]

content:
  - name: catalogue
    label: Catalogue
    type: group
    items:
      - name: oeuvres
        label: Œuvres
        type: collection
        path: content/oeuvres
        format: json
        filename: "{fields.numero}-{fields.titre}.json"
        view:
          fields: [titre, annee, numero, serie]
          primary: titre
          sort: [annee, numero, titre]
          search: [titre, numero, serie]
          default:
            sort: annee
            order: desc
        fields:
          - name: titre
            label: Titre
            type: string
            required: true
          - name: numero
            label: Numéro
            type: string
            required: true
            description: "Le numéro de l'œuvre, par exemple 667. Il sert aussi à la retrouver dans les autres rubriques."
          - name: annee
            label: Année
            type: number
            required: true
          - name: serie
            label: Série
            type: reference
            description: "Laisser vide si l'œuvre n'appartient à aucune série."
            options:
              collection: series
              value: "{nom}"
              label: "{nom}"
          - name: technique
            label: Technique
            type: select
            options:
              values: [Huile sur toile, Encre de Chine sur papier, Dessin, Autre]
          - name: hauteur
            label: Hauteur (cm)
            type: number
            required: true
          - name: largeur
            label: Largeur (cm)
            type: number
            required: true
          - name: photo
            label: Photo
            type: image
            required: true
            description: "La photo du photographe peut être envoyée telle quelle : le fond blanc et le cartel sont retirés automatiquement."
            options:
              media: oeuvres
          - name: disponibilite
            label: Disponibilité
            type: select
            description: "Facultatif. Laisser vide pour ne rien afficher."
            options:
              values: [Disponible, Réservée, Vendue, Collection privée, Sur demande]
          - name: texte
            label: Texte sur l'œuvre
            type: text
            description: "Facultatif. Affiché sur la fiche de l'œuvre. Une ligne vide sépare deux paragraphes."
          - name: masquer
            label: Masquer du site
            type: boolean
            description: "Cochez pour retirer l'œuvre du site sans la supprimer."

      - name: series
        label: Séries
        type: collection
        path: content/series
        format: json
        filename: "{fields.nom}.json"
        view:
          fields: [nom, ordre, annees]
          primary: nom
          sort: [ordre, nom]
          default:
            sort: ordre
            order: asc
        fields:
          - name: nom
            label: Nom de la série
            type: string
            required: true
            description: "Attention : si vous renommez une série, choisissez de nouveau la série sur ses œuvres."
          - name: ordre
            label: Ordre d'affichage
            type: number
            description: "1 pour la première série affichée, 2 pour la suivante, etc."
          - name: annees
            label: Années
            type: string
            description: "Par exemple « 2023 – 2025 ». Laisser vide pour les calculer à partir des œuvres."
          - name: presentation
            label: Image de présentation
            type: reference
            description: "L'œuvre dont un détail représente la série."
            options:
              collection: oeuvres
              value: "{numero}"
              label: "{titre} · {annee} · n° {numero}"
              search: "titre,numero"
          - name: cadrage
            label: Cadrage du détail (0 à 100)
            type: number
            description: "Partie de la toile montrée : 0 = le haut, 50 = le centre, 100 = le bas."
            options:
              min: 0
              max: 100
          - name: description
            label: Description
            type: text
            description: "Facultatif. Affichée sur le bandeau de la série."

      - name: annees
        label: Images des années
        type: file
        path: content/annees.json
        format: json
        list: true
        fields:
          - name: annee
            label: Année
            type: string
            required: true
          - name: presentation
            label: Image de présentation
            type: reference
            options:
              collection: oeuvres
              value: "{numero}"
              label: "{titre} · {annee} · n° {numero}"
              search: "titre,numero"
          - name: cadrage
            label: Cadrage du détail (0 à 100)
            type: number
            description: "0 = le haut de la toile, 50 = le centre, 100 = le bas."
            options:
              min: 0
              max: 100

  - name: pages
    label: Pages
    type: group
    items:
      - name: accueil
        label: Accueil
        type: file
        path: content/accueil.json
        format: json
        fields:
          - name: sections
            label: Sections de la page d'accueil
            description: "Sous l'en-tête, dans l'ordre. Ajoutez, déplacez ou masquez des sections."
            type: block
            blockKey: type
            list:
              collapsible:
                collapsed: true
                summary: "{type} · {titre}"
            blocks:
              - name: accrochage
                label: Accrochage à l'échelle
                fields:
                  - { name: surtitre, label: Petit titre, type: string }
                  - { name: titre, label: Titre, type: text, description: "Entourez un mot d'astérisques pour l'écrire en italique : *le noir*. Un retour à la ligne est respecté." }
                  - { name: texte, label: Texte, type: text }
                  - name: oeuvres
                    label: Œuvres accrochées (2 à 6)
                    type: reference
                    options:
                      collection: oeuvres
                      multiple: true
                      max: 6
                      value: "{numero}"
                      label: "{titre} · {annee} · n° {numero}"
                      search: "titre,numero"
                  - { name: lien_formats, label: "Afficher le lien « Comparer tous les formats »", type: boolean }
                  - { name: masquer, label: Masquer cette section, type: boolean }
              - name: catalogue
                label: Catalogue / publication
                fields:
                  - { name: surtitre, label: Petit titre, type: string }
                  - { name: titre, label: Titre, type: text, description: "Entourez un mot d'astérisques pour l'écrire en italique." }
                  - { name: texte, label: Texte, type: text }
                  - { name: lien, label: Lien vers le catalogue en ligne, type: string }
                  - { name: libelle_bouton, label: Texte du bouton, type: string }
                  - name: couverture
                    label: Photo de la couverture
                    type: image
                    description: "Facultatif. Sans photo, une couverture est composée avec l'œuvre choisie ci-dessous."
                    options:
                      media: images
                  - name: oeuvre
                    label: Œuvre pour la couverture
                    type: reference
                    options:
                      collection: oeuvres
                      value: "{numero}"
                      label: "{titre} · {annee} · n° {numero}"
                      search: "titre,numero"
                  - { name: exemplaire, label: "Afficher « Demander un exemplaire »", type: boolean }
                  - { name: masquer, label: Masquer cette section, type: boolean }
              - name: citation
                label: Citation
                fields:
                  - { name: texte, label: Citation (sans guillemets), type: text }
                  - { name: auteur, label: Auteur, type: string }
                  - { name: masquer, label: Masquer cette section, type: boolean }
              - name: parcours
                label: Parcours (fond sombre)
                fields:
                  - { name: surtitre, label: Petit titre, type: string }
                  - { name: titre, label: Titre, type: text }
                  - { name: texte, label: Texte, type: text }
                  - name: etapes
                    label: Dates clés
                    type: object
                    list:
                      collapsible:
                        collapsed: true
                        summary: "{annee} · {texte}"
                    fields:
                      - { name: annee, label: Année, type: string }
                      - { name: texte, label: Texte, type: string }
                  - { name: lien_bio, label: "Afficher le lien « Lire la biographie »", type: boolean }
                  - { name: masquer, label: Masquer cette section, type: boolean }
              - name: texte
                label: Texte libre (avec image)
                fields:
                  - { name: surtitre, label: Petit titre, type: string }
                  - { name: titre, label: Titre, type: text }
                  - { name: texte, label: Texte, type: text, description: "Une ligne vide sépare deux paragraphes." }
                  - name: image
                    label: Image
                    type: image
                    options:
                      media: images
                  - name: fond
                    label: Fond
                    type: select
                    options:
                      values: [Clair, Gris, Sombre]
                  - { name: masquer, label: Masquer cette section, type: boolean }
              - name: oeuvres
                label: Sélection d'œuvres
                fields:
                  - { name: titre, label: Titre, type: text }
                  - name: oeuvres
                    label: Œuvres choisies
                    type: reference
                    description: "Laisser vide pour montrer les plus récentes."
                    options:
                      collection: oeuvres
                      multiple: true
                      value: "{numero}"
                      label: "{titre} · {annee} · n° {numero}"
                      search: "titre,numero"
                  - { name: nombre, label: Nombre d'œuvres récentes, type: number, description: "Utilisé si aucune œuvre n'est choisie. 3 par défaut." }
                  - { name: masquer, label: Masquer cette section, type: boolean }
              - name: series
                label: Les séries (images de présentation)
                fields:
                  - { name: titre, label: Titre, type: text }
                  - { name: masquer, label: Masquer cette section, type: boolean }
              - name: expositions
                label: Dernières expositions
                fields:
                  - { name: titre, label: Titre, type: text }
                  - { name: nombre, label: Nombre d'expositions, type: number, description: "4 par défaut." }
                  - { name: masquer, label: Masquer cette section, type: boolean }

      - name: biographie
        label: Biographie
        type: file
        path: content/biographie.json
        format: json
        fields:
          - { name: intro, label: Introduction, type: text }
          - name: etapes
            label: Étapes
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{periode}"
            fields:
              - { name: periode, label: Date ou période, type: string }
              - { name: texte, label: Texte, type: text }
          - name: oeuvre
            label: Œuvre affichée à côté
            type: reference
            options:
              collection: oeuvres
              value: "{numero}"
              label: "{titre} · {annee} · n° {numero}"
              search: "titre,numero"

      - name: expositions
        label: Expositions
        type: file
        path: content/expositions.json
        format: json
        fields:
          - { name: intro, label: Introduction, type: text }
          - name: liste
            label: Expositions (la plus récente en premier)
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{date} · {titre}"
            fields:
              - { name: date, label: Date, type: string, description: "Par exemple « 3 – 25 oct. 2020 »." }
              - { name: titre, label: Titre, type: string }
              - { name: lieu, label: Lieu, type: string }
              - { name: organisateur, label: Galerie ou organisateur, type: string }

  - name: reglages
    label: Réglages du site
    type: file
    path: content/site.json
    format: json
    fields:
      - { name: nom, label: Nom affiché, type: string, required: true }
      - { name: sous_titre, label: Sous-titre de l'en-tête, type: string }
      - name: entete
        label: Toile de l'en-tête
        type: object
        fields:
          - name: oeuvre
            label: Œuvre en fond
            type: reference
            options:
              collection: oeuvres
              value: "{numero}"
              label: "{titre} · {annee} · n° {numero}"
              search: "titre,numero"
          - name: position
            label: Partie de la toile montrée (0 à 100)
            type: number
            description: "0 = le haut, 50 = le centre, 100 = le bas. La couleur du texte s'adapte toute seule."
            options:
              min: 0
              max: 100
      - name: menu
        label: Menu
        type: object
        description: "Dans l'ordre d'affichage."
        list:
          collapsible:
            collapsed: true
            summary: "{libelle}"
        fields:
          - { name: libelle, label: Texte, type: string, required: true }
          - name: cible
            label: Page
            type: select
            options:
              values:
                - { name: accueil, label: Accueil }
                - { name: oeuvres, label: Œuvres }
                - { name: expositions, label: Expositions }
                - { name: biographie, label: Biographie }
                - { name: contact, label: Contact }
                - { name: lien, label: Lien vers un autre site }
          - { name: lien, label: Adresse du lien, type: string, description: "Seulement pour « Lien vers un autre site »." }
          - { name: bouton, label: Afficher comme un bouton encadré, type: boolean }
      - name: polices
        label: Polices
        type: object
        fields:
          - name: titres
            label: Police des titres
            type: select
            options:
              values:
                - { name: palatino, label: "Palatino (classique)" }
                - { name: cormorant, label: "Cormorant Garamond (fine, élégante)" }
                - { name: garamond, label: "EB Garamond (livre)" }
                - { name: caslon, label: "Libre Caslon (éditoriale)" }
          - name: texte
            label: Police du texte
            type: select
            options:
              values:
                - { name: hanken, label: "Hanken Grotesk (sobre)" }
                - { name: jost, label: "Jost (géométrique)" }
                - { name: source, label: "Source Sans (neutre)" }
      - name: contact
        label: Contact
        type: object
        fields:
          - { name: intro, label: Texte de la page Contact, type: text }
          - { name: email, label: E-mail, type: string }
          - { name: telephone, label: Téléphone, type: string }
          - { name: adresse, label: Adresse de l'atelier, type: text }
          - { name: visites, label: Visites, type: string, description: "Par exemple « Visites sur rendez-vous »." }
          - { name: instagram, label: Lien Instagram, type: string }
      - { name: pied_de_page, label: Mention en bas de page, type: string }
      - name: referencement
        label: Référencement (Google)
        type: object
        fields:
          - { name: titre, label: Titre de la page, type: string }
          - { name: description, label: Description, type: text }
          - { name: visible_google, label: Visible sur Google, type: boolean, description: "À cocher au lancement définitif du site." }
